<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c1620"/>
      <stop offset="1" stop-color="#2b1d17"/>
    </linearGradient>
    <linearGradient id="gHero" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d76ad4"/>
      <stop offset="1" stop-color="#ff9d6c"/>
    </linearGradient>
    <linearGradient id="gOrange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb27a"/>
      <stop offset="1" stop-color="#ff8f5c"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <circle cx="1180" cy="70" r="360" fill="#ff9d6c" opacity="0.11"/>
  <circle cx="70" cy="640" r="260" fill="#d76ad4" opacity="0.07"/>

  <!-- brand row -->
  <g transform="translate(96,56)">
    <rect width="62" height="62" rx="16" fill="url(#gHero)"/>
    <rect x="11" y="20" width="26" height="31" rx="5" fill="#ffffff" fill-opacity="0.55"/>
    <rect x="21" y="11" width="26" height="31" rx="5" fill="#ffffff"/>
    <path d="M17 46 h20 m-7 -7 l7 7 -7 7" fill="none" stroke="#14101f" stroke-width="4"
          stroke-linecap="round" stroke-linejoin="round"/>
    <text x="82" y="27" fill="#f0f0f5" font-size="29" font-weight="700">Tab Share <tspan fill="#ffb98f">shortener</tspan></text>
    <g transform="translate(406,3)">
      <rect width="120" height="27" rx="13.5" fill="none" stroke="url(#gHero)" stroke-width="2"/>
      <text x="60" y="18.5" text-anchor="middle" fill="#ffe6d4" font-size="13" font-weight="700" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">s.kaikay.de</text>
    </g>
    <text x="82" y="52" fill="#9c9cad" font-size="15">self-hostable &#183; Node or a Cloudflare Worker &#183; zero npm dependencies &#183; AGPL-3.0</text>
  </g>

  <!-- headline -->
  <text x="96" y="196" fill="#f7f2ef" font-size="46" font-weight="800">One short link for a whole tab collection.</text>
  <text x="96" y="240" fill="#e6d9cf" font-size="22" font-weight="500">Tab Share links carry every page in the URL, so they get long. This trims one to a stub,</text>
  <text x="96" y="270" fill="#e6d9cf" font-size="22" font-weight="500">and since it just redirects to the viewer, the short link still opens in <tspan fill="#ffc9a6" font-weight="700">any browser, no extension</tspan>.</text>

  <!-- pipeline -->
  <g transform="translate(96,326)">
    <!-- long link -->
    <g transform="translate(0,22)">
      <rect width="360" height="52" rx="26" fill="#20202c" stroke="#5a4fa0"/>
      <circle cx="28" cy="26" r="10" fill="#8b7dff"/>
      <text x="50" y="31" fill="#e7e3ff" font-size="14" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">kaikayy.github.io/&#8230;#N4IgLg9g&#8230;</text>
    </g>
    <text x="180" y="112" text-anchor="middle" fill="#9c9cad" font-size="13" font-weight="600">the share link &#183; ~6 KB</text>

    <!-- /new node on the arrow -->
    <path d="M374 48 h32 m92 0 h32 m-12 -8 l12 8 -12 8" fill="none" stroke="#7d7d8c" stroke-width="3.5"
          stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(406,24)">
      <rect width="92" height="48" rx="13" fill="url(#gOrange)"/>
      <text x="46" y="22" text-anchor="middle" fill="#241207" font-size="13" font-weight="800" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">/new</text>
      <text x="46" y="38" text-anchor="middle" fill="#241207" font-size="10" font-weight="600" opacity="0.85">shorten</text>
    </g>

    <!-- short link -->
    <g transform="translate(562,22)">
      <rect width="360" height="52" rx="26" fill="#241a1c" stroke="#c07a4e"/>
      <circle cx="28" cy="26" r="10" fill="url(#gOrange)"/>
      <text x="50" y="31" fill="#ffe9db" font-size="14" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">s.kaikay.de/swift-amber-otter</text>
    </g>
    <text x="742" y="112" text-anchor="middle" fill="#9c9cad" font-size="13" font-weight="600">short link &#183; opens the same slideshow</text>

    <path d="M938 48 h34 m-12 -8 l12 8 -12 8" fill="none" stroke="#7d7d8c" stroke-width="3.5"
          stroke-linecap="round" stroke-linejoin="round"/>

    <!-- slideshow -->
    <g transform="translate(992,-2)" filter="url(#soft)">
      <rect width="124" height="100" rx="12" fill="#1e1e29" stroke="#34343f"/>
      <rect width="124" height="19" rx="12" fill="#262633"/>
      <rect y="9" width="124" height="10" fill="#262633"/>
      <circle cx="12" cy="9" r="3" fill="#3a3a47"/><circle cx="22" cy="9" r="3" fill="#3a3a47"/><circle cx="32" cy="9" r="3" fill="#3a3a47"/>
      <rect x="40" y="36" width="44" height="34" rx="8" fill="#ff9d6c"/>
      <path d="M14 53 l-7 7 7 7 M110 53 l7 7 -7 7" fill="none" stroke="#f0f0f5" stroke-width="3"
            stroke-linecap="round" stroke-linejoin="round"/>
      <g transform="translate(42,88)" fill="#3a3a47">
        <circle cx="0" cy="0" r="2.6"/><circle cx="10" cy="0" r="2.6"/><circle cx="20" cy="0" r="2.6" fill="#ff9d6c"/><circle cx="30" cy="0" r="2.6"/><circle cx="40" cy="0" r="2.6"/>
      </g>
    </g>
    <text x="1054" y="112" text-anchor="middle" fill="#9c9cad" font-size="13" font-weight="600">slideshow</text>
  </g>

  <!-- feature chips -->
  <g transform="translate(96,486)" font-size="14.5" font-weight="600">
    <g>
      <rect width="196" height="36" rx="18" fill="#2c2119" stroke="#a06a4f"/>
      <text x="98" y="23" text-anchor="middle" fill="#ffcdaa">zero npm dependencies</text>
    </g>
    <g transform="translate(212,0)">
      <rect width="318" height="36" rx="18" fill="#2c2119" stroke="#a06a4f"/>
      <text x="159" y="23" text-anchor="middle" fill="#ffcdaa">host-allowlisted, not an open redirector</text>
    </g>
    <g transform="translate(550,0)">
      <rect width="392" height="36" rx="18" fill="#2c2119" stroke="#a06a4f"/>
      <text x="196" y="23" text-anchor="middle" fill="#ffcdaa">no IP, no cookies &#183; aggregate only &#183; never sold</text>
    </g>
  </g>

  <text x="96" y="596" fill="#7a6f68" font-size="14">github.com/kaikayy/tab-share-shortener</text>
  <text x="1184" y="596" text-anchor="end" fill="#7a6f68" font-size="14">part of the Tab Share suite</text>
</svg>
